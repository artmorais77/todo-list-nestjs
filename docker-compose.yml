services:
  db:
    image: 'postgres:18-alpine'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: todo_list
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      - db

volumes:
  postgres_data: